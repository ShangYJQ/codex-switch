name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

env:
  BIN_NAME: codex-switch
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build ${{ matrix.artifact_name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            artifact_name: codex-switch-linux-x86_64
            archive_ext: tar.gz
            exe_suffix: ""
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            artifact_name: codex-switch-linux-aarch64
            archive_ext: tar.gz
            exe_suffix: ""
          - os: macos-15-intel
            target: x86_64-apple-darwin
            artifact_name: codex-switch-macos-x86_64
            archive_ext: tar.gz
            exe_suffix: ""
          - os: macos-15
            target: aarch64-apple-darwin
            artifact_name: codex-switch-macos-aarch64
            archive_ext: tar.gz
            exe_suffix: ""
          - os: windows-2022
            target: x86_64-pc-windows-msvc
            artifact_name: codex-switch-windows-x86_64
            archive_ext: zip
            exe_suffix: ".exe"

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Rust target
        run: rustup target add ${{ matrix.target }}

      - name: Build
        run: cargo build --locked --release --target ${{ matrix.target }}

      - name: Package Unix artifact
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euxo pipefail
          staging="${{ matrix.artifact_name }}"
          archive="${staging}.${{ matrix.archive_ext }}"
          mkdir "${staging}"
          cp "target/${{ matrix.target }}/release/${BIN_NAME}${{ matrix.exe_suffix }}" "${staging}/"
          cp README.md LICENSE "${staging}/"
          tar -czf "${archive}" "${staging}"
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum "${archive}" > "${archive}.sha256"
          else
            shasum -a 256 "${archive}" > "${archive}.sha256"
          fi

      - name: Package Windows artifact
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $staging = "${{ matrix.artifact_name }}"
          $archive = "$staging.${{ matrix.archive_ext }}"
          $binary = "target\${{ matrix.target }}\release\${env:BIN_NAME}${{ matrix.exe_suffix }}"
          New-Item -ItemType Directory -Path $staging | Out-Null
          Copy-Item $binary -Destination $staging
          Copy-Item -Path README.md, LICENSE -Destination $staging
          Compress-Archive -Path "$staging\*" -DestinationPath $archive -Force
          $hash = (Get-FileHash $archive -Algorithm SHA256).Hash.ToLower()
          "$hash  $archive" | Out-File -Encoding ascii "$archive.sha256"

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact_name }}
          path: |
            ${{ matrix.artifact_name }}.${{ matrix.archive_ext }}
            ${{ matrix.artifact_name }}.${{ matrix.archive_ext }}.sha256
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v7
        with:
          path: dist
          merge-multiple: true

      - name: Publish release
        uses: softprops/action-gh-release@v3
        with:
          files: dist/*
          generate_release_notes: true
